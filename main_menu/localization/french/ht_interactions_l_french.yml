 # ── Diplomacy ────────────────────────────────────────────────────────────────
 ht_force_alliance: "@g2a! Force Alliance"
 ht_force_alliance_desc: "Impose une [alliance|e] entre deux pays."
 ht_force_alliance_act: "$ht_display_recipient_caps$ s'aligne sur $ht_display_target$."
